lua_warehouse:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('PGHOST', '127.0.0.1') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'postgres') }}"
      password: "{{ env_var('DBT_ENV_SECRET_PGPASSWORD') }}"
      dbname: "{{ env_var('PGDATABASE', 'laptop') }}"
      schema: "{{ env_var('LUA_BUILD_SCHEMA') }}"
      threads: 2
      connect_timeout: 10
      sslmode: prefer
